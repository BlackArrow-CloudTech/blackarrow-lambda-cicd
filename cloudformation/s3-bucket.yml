AWSTemplateFormatVersion: "2010-09-09"
Description: 'S3 Bucket for our CICD PR'

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - test
      - staging
      - production

Resources:
  HouseOfYorkS31978Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub '${AWS::StackName}-${Environment}-bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: CreatedBy
          Value: GithubActionsTesting

Outputs:
  BucketName:
    Description: "Name of the S3 bucket"
    Value: !Ref HouseOfYorkS31978Bucket
    